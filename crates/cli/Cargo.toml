[package]
name = "sdrtx"
description = "Command-line transmitter for HackRF"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sdrtx-core.workspace = true
sdrtx-dsp.workspace = true
sdrtx-hackrf.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
hound = "3.5"
sdrtx-radio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
